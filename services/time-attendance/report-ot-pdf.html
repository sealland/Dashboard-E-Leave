<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>รายงาน OT พนักงาน (PDF) — Time Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <p class="brand-title">HR</p>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-user">
          <div class="avatar">ผ</div>
          <div>
            <strong>ผู้บริหาร</strong>
            <span>Executive</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="page-head">
          <div>
            <p class="eyebrow">Overtime</p>
            <h1>รายงาน OT <span>พนักงาน (PDF)</span></h1>
            <p class="page-subtitle">เลือกงวดเดือน ประเภท OT และสาขาเพื่อดูรายงาน PDF</p>
          </div>
        </header>

        <section class="panel legacy-report-panel">
          <div class="legacy-controls legacy-controls--ot">
            <label>
              <span>Period</span>
              <input id="period" type="month" />
            </label>
            <label>
              <span>ประเภท OT</span>
              <select id="df_code">
                <option value="1110">1110 - ค่าล่วงเวลาX1</option>
                <option value="1120" selected>1120 - ค่าล่วงเวลาX1.5</option>
                <option value="1130">1130 - ค่าล่วงเวลาX2</option>
                <option value="1140">1140 - ค่าล่วงเวลาX3</option>
                <option value="1150">1150 - ค่าล่วงเวลา</option>
              </select>
            </label>
            <label>
              <span>สาขา</span>
              <select id="br_code">
                <option value="ALL" selected>ALL</option>
              </select>
              <small id="br_status" class="legacy-field-hint" hidden></small>
            </label>
            <div class="legacy-actions">
              <button id="viewBtn" type="button" class="btn btn-primary">ดูรายงาน</button>
              <button id="openBtn" type="button" class="btn btn-ghost">เปิดแท็บใหม่</button>
              <button id="copyBtn" type="button" class="btn btn-ghost">คัดลอกลิงก์</button>
            </div>
          </div>
          <div class="legacy-preview">
            <div class="loading-overlay" id="loadingOverlay" hidden>
              <p>กำลังโหลดรายงาน...</p>
            </div>
            <iframe id="reportFrame" title="รายงาน OT พนักงาน"></iframe>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./report-ot-pdf.js"></script>
  </body>
</html>
